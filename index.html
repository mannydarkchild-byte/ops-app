    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "OPS",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "url": "https://opsapp.africa/",
        "image": "https://opsapp.africa/assets/og-logo.jpg",
        "description": "Equipment operations and shift verification for plant hire, crushing, screening and earthmoving fleets. Verified machine hours, photo evidence, downtime accountability and supervisor sign-off — even without signal.",
        "offers": {
          "@type": "Offer",
          "availability": "https://schema.org/OnlineOnly",
          "priceCurrency": "ZAR"
        }
      }
    </script>
    <script>
      try {
        var t = localStorage.getItem("ops-theme");
        var light = t === "light";
        if (light) document.documentElement.classList.add("theme-light");
        document.documentElement.dataset.theme = light ? "light" : "dark";
        document.documentElement.style.colorScheme = light ? "light" : "dark";
        document.querySelector('meta[name="color-scheme"]')?.setAttribute("content", light ? "light" : "dark");
        document.querySelectorAll('meta[name="theme-color"]').forEach(function (meta) {
          meta.setAttribute("content", "#0A0A0A");
        });
        document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]')
          ?.setAttribute("content", "black");
      } catch (e) {}
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
