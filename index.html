<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover, user-scalable=yes"
    />
    <meta name="theme-color" content="#0A0A0A" />
    <script>
      try {
        var t = localStorage.getItem("ops-theme");
        if (t === "light") document.documentElement.classList.add("theme-light");
        document.documentElement.dataset.theme = t === "light" ? "light" : "dark";
        if (t === "light") {
          document.querySelector('meta[name="theme-color"]')?.setAttribute("content", "#F6F1DE");
        }
        document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]')
          ?.setAttribute("content", t === "light" ? "default" : "black");
      } catch (e) {}
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="OPS" />
    <meta name="format-detection" content="telephone=no" />
    <meta
      name="description"
      content="OPS is the dispute-proof equipment operations and digital shift verification platform for plant hire, mining contractors, and quarry fleets. 100% offline-ready."
    />
    <title>OPS | Heavy Equipment Operations & Shift Verification Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Russo+One&display=swap"
    />
    <link rel="icon" type="image/png" href="/logo.png?v=2" />
    <link rel="apple-touch-icon" href="/logo.png?v=2" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
